[project]
name = "layoutsee-core"
version = "0.1.0"
description = "LayoutSee 第一方本地 Core 与可控测试替身"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic==2.11.7",
    "elementpath==4.8.0",
]

[project.optional-dependencies]
packaging = ["pyinstaller==6.22.2"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layoutsee_core"]
