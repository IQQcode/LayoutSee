<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>LayoutSee 正在启动</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; color: #1d1d1f; background: #f5f6f8; }
      * { box-sizing: border-box; }
      body { margin: 0; -webkit-app-region: drag; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 40px; }
      section { width: min(440px, 100%); display: grid; justify-items: center; padding: 40px; border: 1px solid rgba(0,0,0,.09); border-radius: 20px; background: rgba(255,255,255,.86); box-shadow: 0 24px 80px rgba(20,28,40,.11); text-align: center; }
      .mark { display: block; width: 66px; height: 66px; margin-bottom: 22px; animation: mark-breathe 3.6s ease-in-out infinite; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
      p { min-height: 22px; margin: 10px 0 0; color: #6e7480; font-size: 13px; line-height: 22px; }
      .detail { margin-top: 6px; color: #b0323c; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      /* ThinkingOrb 风格加载球（panelui ThinkingOrb 视觉，canvas 点阵重写）：working=倾斜轨道粒子流，searching=点阵球+扫描经线 */
      .orb { width: 88px; height: 88px; margin-top: 14px; }
      .mark { display: block; width: 66px; height: 66px; margin-bottom: 22px; animation: mark-breathe 3.6s ease-in-out infinite; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
      p { min-height: 22px; margin: 10px 0 0; color: #6e7480; font-size: 13px; line-height: 22px; }
      @keyframes mark-breathe { 0%, 100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.045); opacity: 1; } }
      .actions { display: none; gap: 10px; margin-top: 24px; -webkit-app-region: no-drag; }
      button { height: 36px; padding: 0 15px; border: 1px solid rgba(0,0,0,.12); border-radius: 9px; background: rgba(255,255,255,.9); color: inherit; font: inherit; }
      button.primary { border-color: #0071e3; background: #0071e3; color: white; }
      button:hover { filter: brightness(.98); }
      button:active { transform: translateY(1px); }
      body.failed .mark { animation: none; }
      body.failed .orb { display: none; }
      body.failed .actions { display: flex; flex-wrap: wrap; justify-content: center; }
      @media (prefers-color-scheme: dark) { :root { color: #f5f5f7; background: #17181b; } section { border-color: rgba(255,255,255,.11); background: rgba(32,34,38,.88); } p { color: #a8adb7; } button { border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.08); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; transform: none; opacity: 1; } }
    </style>
  </head>

      // working = 粒子沿倾斜轨道流动；searching = 经纬点阵球 + 扫描经线；failed/stopped 隐藏。
      const orb = (() => {
        const canvas = document.getElementById("orb");
        if (!canvas || !canvas.getContext) return null;
        const ctx = canvas.getContext("2d");
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        const SIZE = 88;
        canvas.width = SIZE * DPR;
        canvas.height = SIZE * DPR;
        const R = SIZE * 0.42;
        const TILT = -0.45;
        const darkQuery = matchMedia("(prefers-color-scheme: dark)");
        const reducedQuery = matchMedia("(prefers-reduced-motion: reduce)");
        let rgb = darkQuery.matches ? "109, 184, 255" : "0, 113, 227";
        darkQuery.addEventListener?.("change", () => { rgb = darkQuery.matches ? "109, 184, 255" : "0, 113, 227"; });

        // 经纬点阵球（searching）
        const globe = [];
        const RINGS = 10;
        for (let i = 1; i < RINGS; i++) {
          const phi = Math.PI * i / RINGS;
          const count = Math.max(4, Math.round(Math.sin(phi) * 18));
          for (let j = 0; j < count; j++) globe.push([phi, Math.PI * 2 * j / count]);
        }
        // 倾斜轨道环（working）：每条环一束散点，速度/倾角/散布各不相同
        const orbits = [
          { tilt: -0.9, yaw: 0.3, speed: 1.35, phase: 0.4, dots: 13, spread: .34 },
          { tilt: -0.2, yaw: 1.9, speed: 1.05, phase: 2.2, dots: 11, spread: .26 },
          { tilt: 0.5, yaw: 3.6, speed: 0.85, phase: 4.0, dots: 10, spread: .30 },
          { tilt: -1.3, yaw: 5.1, speed: 1.2, phase: 1.1, dots: 9, spread: .22 },
          { tilt: 1.0, yaw: 2.6, speed: 0.7, phase: 5.0, dots: 8, spread: .38 },
        ];
        const jit = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
        const rotX = (x, y, z, a) => [x, y * Math.cos(a) - z * Math.sin(a), y * Math.sin(a) + z * Math.cos(a)];
        const rotY = (x, y, z, a) => [x * Math.cos(a) + z * Math.sin(a), y, -x * Math.sin(a) + z * Math.cos(a)];

        let mode = "working";
        let raf = 0;

        const dot = (x, y, z, size, alpha) => {
          const depth = (z + 1) / 2;
          ctx.globalAlpha = alpha * (0.22 + 0.78 * depth * depth);
          ctx.beginPath();
          ctx.arc(SIZE / 2 + x * R, SIZE / 2 + y * R, size * (0.7 + 0.55 * depth), 0, Math.PI * 2);
          ctx.fillStyle = `rgb(${rgb})`;
          ctx.fill();
        };

        const draw = (t) => {
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.clearRect(0, 0, SIZE, SIZE);
          if (mode === "working") {
            for (const o of orbits) {
              let u = rotY(1, 0, 0, o.yaw); u = rotX(u[0], u[1], u[2], o.tilt);
              let w = rotY(0, 0, 1, o.yaw); w = rotX(w[0], w[1], w[2], o.tilt);
              for (let i = 0; i < o.dots; i++) {
                const s = t * o.speed + o.phase + i * (Math.PI * 2 / o.dots);
                const rr = 0.8 + o.spread * jit(o.phase + i, o.yaw);
                const px = (Math.cos(s) * u[0] + Math.sin(s) * w[0]) * rr;
                const py = (Math.cos(s) * u[1] + Math.sin(s) * w[1]) * rr;
                const pz = (Math.cos(s) * u[2] + Math.sin(s) * w[2]) * rr;
                dot(px, py, pz, 1.5, .9);
                const st = s - 0.24;
                dot((Math.cos(st) * u[0] + Math.sin(st) * w[0]) * rr, (Math.cos(st) * u[1] + Math.sin(st) * w[1]) * rr, (Math.cos(st) * u[2] + Math.sin(st) * w[2]) * rr, 1.0, .3);
              }
            }
          } else {
            const spin = t * 0.32;
            for (const [phi, theta] of globe) {
              const th = theta + spin;
              const [rx, ry, rz] = rotX(Math.sin(phi) * Math.cos(th), Math.cos(phi), Math.sin(phi) * Math.sin(th), TILT);
              dot(rx, ry, rz, 1.2, .8);
            }
            const lam = t * 1.4;
            for (let k = 0; k < 7; k++) {
              const a = lam - k * 0.09;
              const fade = 1 - k / 7;
              for (let j = 0; j <= 36; j++) {
                const phi = Math.PI * 2 * j / 36;
                const [rx, ry, rz] = rotX(Math.sin(phi) * Math.cos(a), Math.cos(phi), Math.sin(phi) * Math.sin(a), TILT);
                dot(rx, ry, rz, k === 0 ? 1.7 : 1.1, (k === 0 ? .95 : .5) * fade);
              }
            }
          }
          ctx.globalAlpha = 1;
        };

        const loop = (ts) => { draw(ts / 1000); raf = requestAnimationFrame(loop); };
        if (reducedQuery.matches) {
          draw(2.4); // 静态帧：点阵球固定一瞬
        } else {
          raf = requestAnimationFrame(loop);
        }
        return (state) => {
          mode = state === "validating" || state === "unhealthy" || state === "restarting" ? "searching" : "working";
          canvas.style.display = state === "failed" || state === "stopped" ? "none" : "";
          if (reducedQuery.matches) draw(2.4);
        };
      })();

      const descriptions = {
        idle: "正在准备本地运行环境…",
        starting: "正在启动本地 Core…",
        validating: "正在校验 Core 身份与版本…",
        ready: "Core 已就绪，正在打开工作台…",
        unhealthy: "Core 暂时失去响应，正在尝试恢复…",
        restarting: "正在等待 Core 恢复…",
        stopping: "正在安全退出…",
        stopped: "Core 已停止。",
        failed: "Core 启动失败，请重试或查看日志。",
      };
      const detailDescriptions = {
        CORE_READY_TIMEOUT: "启动超时：Core 未在 15 秒内就绪。",
        CORE_INFO_UNAVAILABLE: "Core 已启动，但信息接口不可用。",
        CORE_IDENTITY_MISMATCH: "Core 身份校验失败，已拒绝连接。",
        VERSION_INCOMPATIBLE: "Core 与壳的版本不兼容，请更新整套应用。",
        CORE_RESTART_BUDGET_EXHAUSTED: "多次自动恢复失败，已停止重试。",
        CORE_START_FAILED: "Core 制品可能缺失或损坏。",
      };
      const describeDetail = (detail) => {
        if (detailDescriptions[detail]) return detailDescriptions[detail];
        const exitMatch = /^CORE_EXITED_(-?\d+)$/.exec(detail || "");
        if (exitMatch) return `Core 异常退出（退出码 ${exitMatch[1]}），请复制诊断信息排查。`;
        return null;
      };
      let startedAt = Date.now();
      let timer = 0;
      const update = (session) => {
        const state = session?.state ?? "starting";
        document.body.classList.toggle("failed", state === "failed");
        if (orb) orb(state);
        const friendly = state === "failed" && session?.detail ? describeDetail(session.detail) : null;
        const description = friendly ?? descriptions[state] ?? "正在启动…";
        document.getElementById("status").textContent = description;
        document.getElementById("detail").textContent = state === "failed" && !friendly && session?.detail ? session.detail : "";
        if (state === "failed") {
          clearInterval(timer);
        } else if (!timer) {
          timer = setInterval(() => {
            const seconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
            if (document.body.classList.contains("failed")) return;
            document.getElementById("status").textContent = `${descriptions[document.body.dataset.state] ?? "正在启动…"}（${seconds} 秒）`;
          }, 1000);
        }
        document.body.dataset.state = state;
      };
      // 壳 API 仅在 Electron preload 下存在；缺壳（如浏览器直接打开预览）时只展示静态视觉
      const shell = window.layoutSeeShell;
      if (shell) {
        shell.getKernelSession().then(update);
        shell.onKernelStateChange(update);
        document.getElementById("retry").addEventListener("click", () => { startedAt = Date.now(); shell.retryKernel(); });
        document.getElementById("logs").addEventListener("click", () => shell.openLogsDir());
        document.getElementById("copy").addEventListener("click", async () => {
          await shell.copySanitizedDiagnostics();
          const button = document.getElementById("copy");
          button.textContent = "已复制";
          setTimeout(() => { button.textContent = "复制诊断"; }, 1600);
        });
        document.getElementById("quit").addEventListener("click", () => shell.quit());
      }
    </script>
  </body>
</html>
