appId: com.layoutsee.desktop
productName: LayoutSee
copyright: Copyright © 2026 LayoutSee
asar: true
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/runtime/core
    to: core
    filter:
      - "**/*"
  - from: resources/runtime/web
    to: web
    filter:
      - "**/*"
  - from: resources/runtime/artifact-manifest.json
    to: artifact-manifest.json
mac:
  target:
    # arch 不在此固定：scripts/package.mjs 以 --arm64 / --x64 显式下发，一套配置出双架构 DMG
    - target: dmg
  # Electron 44 框架硬下限为 macOS 13（Ventura），显式钉死避免版本漂移；低于 13 的机器任何架构都无法启动
  minimumSystemVersion: "13.0"
  category: public.app-category.developer-tools
  icon: build/LayoutSee.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
dmg:
  artifactName: "LayoutSee-${version}-${arch}.${ext}"
  title: "LayoutSee ${version}"
  sign: false
  # DMG 体积：package.mjs 在 electron-builder 产出 UDZO 后统一转 ULMO（完整块级 lzfse），
  # blockmap 因后处理失效且产品无自动更新，这里停生成
  writeUpdateInfo: false
publish: null
